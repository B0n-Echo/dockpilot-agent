<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1136 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dockpilot-code-map-title dockpilot-code-map-desc">
      <title id="dockpilot-code-map-title">How DockPilot connects</title>
      <desc id="dockpilot-code-map-desc">DockPilot's parts: browser pages call the web server; the conversation agent reads each message with the AI (rules as fallback), finds slots with 15 rules, allocates and holds them, books them; a 5-second timer runs due work; everything is stored in one SQLite working copy and traced to LangSmith.</desc>
